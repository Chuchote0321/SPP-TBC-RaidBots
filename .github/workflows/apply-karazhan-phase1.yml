name: Apply Karazhan Phase 1

"on":
  push:
    branches:
      - feature/karazhan-phase1
    paths:
      - .github/workflows/apply-karazhan-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          ref: feature/karazhan-phase1
          fetch-depth: 0

      - name: Reassemble verified source payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local output="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode > "${output}"
          }

          fetch_blob 3014cff2f941c50f89dc45bea487a73eb98a7931 /tmp/karazhan.00
          fetch_blob 9f624ef9e760d292a3a8dbdc40a3f37080c054cf /tmp/karazhan.01
          fetch_blob 30039dd216c7ac3d95b0cf900d97540d2ab611d5 /tmp/karazhan.02
          cat /tmp/karazhan.00 /tmp/karazhan.01 /tmp/karazhan.02 \
            > /tmp/karazhan_phase1_payload.tar.gz

          echo "0f4c8267e39bade8ac3e6a49bd170ac80af75d9c54a22b6f7e2edac1d50e494b  /tmp/karazhan_phase1_payload.tar.gz" \
            | sha256sum --check --strict
          tar -tzf /tmp/karazhan_phase1_payload.tar.gz
          tar -xzf /tmp/karazhan_phase1_payload.tar.gz -C .

      - name: Verify exact port contracts
        run: |
          set -euo pipefail
          rm -rf tools/raid/__pycache__
          python3 tools/raid/verify_port_scope.py
          python3 tools/raid/verify_gruul_native_strategy.py
          python3 tools/raid/verify_karazhan_phase1.py
          git diff --check
          test -z "$(find . -type d -name __pycache__ -o -type f -name '*.pyc')"

      - name: Commit phase-one source and retire applicator
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-karazhan-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Karazhan payload diff produced" >&2
            exit 1
          fi
          git commit -m "Karazhan: port Attumen, Moroes and Maiden strategies"
          git push origin HEAD:feature/karazhan-phase1
